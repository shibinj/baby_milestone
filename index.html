<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Milestone Tracker</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.local.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            background: #f0f2f5;
            min-height: 100vh;
        }

        /* ── Screens ─────────────────────────────────────── */
        .screen {
            background: #f0f2f5;
            min-height: 100vh;
            padding-bottom: 30px;
        }
        #listScreen {
            display: none;
            position: fixed;
            inset: 0;
            max-width: 600px;
            margin: 0 auto;
            z-index: 200;
            overflow-y: auto;
        }
        #listScreen.open { display: block; }

        /* ── Loading / Auth ──────────────────────────────── */
        #loadingScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #999;
            font-size: 15px;
        }
        #authScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            text-align: center;
        }
        #authScreen h1 { font-size: 22px; margin-bottom: 8px; color: #222; }
        #authScreen p  { color: #777; margin: 0 0 32px; line-height: 1.5; }
        .sign-in-btn {
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(66,133,244,0.35);
        }
        .sign-in-btn:active { background: #2a6dd9; }

        /* ── App Header ──────────────────────────────────── */
        .app-header {
            background: white;
            padding: 14px 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e8e8e8;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .app-header h1 { margin: 0; font-size: 17px; color: #222; }
        .user-info { font-size: 11px; color: #aaa; margin-bottom: 3px; text-align: right; }
        .sign-out-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .sign-out-btn:active { background: #fecaca; }

        /* ── Cards / Sections ────────────────────────────── */
        .section {
            background: white;
            margin: 12px 12px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 12px 16px 8px;
        }

        /* ── Overview stats ──────────────────────────────── */
        #overviewPanel { display: none; }
        .stats-row {
            display: flex;
            padding: 4px 12px 14px;
            gap: 8px;
        }
        .stat-card {
            flex: 1;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px 8px;
            text-align: center;
        }
        .stat-value { font-size: 20px; font-weight: 700; color: #222; }
        .stat-label { font-size: 10px; color: #aaa; margin-top: 2px; }
        .stat-sub   { font-size: 11px; color: #555; margin-top: 4px; font-weight: 600; line-height: 1.4; }

        /* ── Milestone activity panel ────────────────────── */
        #milestonePanel { display: none; }
        #milestonePanel.has-items { display: block; }
        .milestone-item {
            margin: 4px 12px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .milestone-item:last-child { margin-bottom: 12px; }
        .milestone-item.today    { background: #eff6ff; border-left: 4px solid #3b82f6; }
        .milestone-item.upcoming { background: #fffbeb; border-left: 4px solid #f59e0b; }
        .milestone-item.recent   { background: #f0fdf4; border-left: 4px solid #22c55e; }

        /* ── Form ────────────────────────────────────────── */
        .form-section { padding: 4px 16px 16px; }
        label {
            display: block;
            margin: 14px 0 5px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            color: #222;
            background: #fafafa;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #4CAF50; background: white; }
        .two-col { display: flex; gap: 10px; }
        .two-col input { flex: 1; }

        /* ── Primary buttons ─────────────────────────────── */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn:active { opacity: 0.85; }
        .btn-green  { background: #4CAF50; color: white; }
        .btn-blue   { background: #2196F3; color: white; }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-row .btn { margin-top: 0; flex: 1; font-size: 13px; padding: 12px 4px; }
        .btn-teal   { background: #00897B; color: white; }
        .btn-purple { background: #9C27B0; color: white; }
        .btn-cyan   { background: #00BCD4; color: white; }
        #importFile { display: none; }

        /* ── List screen ─────────────────────────────────── */
        .list-header {
            background: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e8e8e8;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-btn {
            background: #f0f2f5;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 15px;
            font-weight: 600;
            color: #2196F3;
            cursor: pointer;
            white-space: nowrap;
        }
        .back-btn:active { background: #e2e5ea; }
        .list-header h2 { margin: 0; font-size: 17px; flex: 1; }
        .list-count { font-size: 13px; color: #aaa; white-space: nowrap; }

        /* ── Baby accordion cards ────────────────────────── */
        .baby-card {
            background: white;
            margin: 10px 12px 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .baby-row {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .baby-row:active { background: #f8f8f8; }
        .baby-row-info { flex: 1; }
        .baby-row-name { font-size: 16px; font-weight: 600; color: #222; display: block; }
        .baby-row-date { font-size: 13px; color: #999; margin-top: 2px; display: block; }
        .chevron {
            font-size: 20px;
            color: #ccc;
            transition: transform 0.2s;
            line-height: 1;
        }
        .chevron.open { transform: rotate(90deg); color: #4CAF50; }

        /* ── Expanded detail ─────────────────────────────── */
        .baby-detail {
            display: none;
            border-top: 1px solid #f0f0f0;
        }
        .detail-view, .edit-form { padding: 12px 16px 16px; }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .detail-row:last-of-type { border-bottom: none; }
        .detail-label { color: #888; }
        .detail-value { font-weight: 600; color: #333; text-align: right; }

        .detail-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .action-btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .action-btn:active { opacity: 0.8; }
        .edit-btn-card   { background: #fff3e0; color: #e65100; }
        .delete-btn-card { background: #fdecea; color: #c62828; }

        /* ── Inline edit form ────────────────────────────── */
        .edit-form label { margin: 10px 0 4px; font-size: 13px; }
        .edit-form input {
            padding: 10px 12px;
            font-size: 15px;
            border-radius: 8px;
        }
        .edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .save-btn   { flex: 1; background: #4CAF50; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .cancel-btn { flex: 1; background: #f0f2f5; color: #555;  padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .save-btn:active   { background: #43a047; }
        .cancel-btn:active { background: #e2e5ea; }

        /* ── Calc results ────────────────────────────────── */
        .results-panel {
            display: none;
            background: #f0fdf4;
            margin: 12px 12px 0;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .results-panel h3 { margin: 0 0 12px; font-size: 16px; color: #222; }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #dcfce7;
            font-size: 14px;
        }
        .result-row:last-child { border-bottom: none; }
        .result-label { color: #555; }
        .result-value { font-weight: 600; color: #166534; }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loadingScreen">Loading...</div>

    <!-- Auth -->
    <div id="authScreen">
        <h1>👶 Baby Milestone Tracker</h1>
        <p>Sign in to keep your data safe<br>and synced across all your devices.</p>
        <button class="sign-in-btn" onclick="signInWithGoogle()">🔑 Sign in with Google</button>
    </div>

    <!-- Main app screen -->
    <div id="appContent" class="screen" style="display:none">

        <div class="app-header">
            <h1>👶 Baby Milestone Tracker</h1>
            <div>
                <div class="user-info" id="userEmail"></div>
                <button class="sign-out-btn" onclick="doSignOut()">Sign Out</button>
            </div>
        </div>

        <!-- Overview -->
        <div class="section" id="overviewPanel">
            <div class="section-title">Overview</div>
            <div class="stats-row" id="statsRow"></div>
        </div>

        <!-- Milestone activity -->
        <div class="section" id="milestonePanel">
            <div class="section-title">Milestone Activity</div>
            <div id="milestoneItems"></div>
        </div>

        <!-- Calc results -->
        <div class="results-panel" id="results"></div>

        <!-- Entry form -->
        <div class="section">
            <div class="form-section">
                <label>Baby's Name</label>
                <input type="text" id="babyName" placeholder="Enter baby's name" autocomplete="off">

                <label>Birth Date</label>
                <input type="date" id="birthDate">

                <label>Gestational Age</label>
                <div class="two-col">
                    <input type="number" id="gestationalWeeks" placeholder="Weeks (20–44)" min="20" max="44">
                    <input type="number" id="gestationalDays"  placeholder="Days (0–6)"   min="0"  max="6">
                </div>

                <button class="btn btn-green" onclick="calculateMilestones()">Calculate &amp; Save</button>
                <button class="btn btn-blue"  onclick="viewSavedData()">View Saved Babies</button>

                <div class="btn-row">
                    <button class="btn btn-teal"   onclick="exportCSV()">📊 CSV</button>
                    <button class="btn btn-purple"  onclick="exportData()">📥 JSON</button>
                    <button class="btn btn-cyan"    onclick="document.getElementById('importFile').click()">📤 Import</button>
                </div>
                <input type="file" id="importFile" accept=".json" onchange="importData(event)">
            </div>
        </div>

    </div><!-- /#appContent -->

    <!-- List screen (full-screen overlay) -->
    <div id="listScreen" class="screen">
        <div class="list-header">
            <button class="back-btn" onclick="closeListScreen()">‹ Back</button>
            <h2>Saved Babies</h2>
            <span class="list-count" id="listCount"></span>
        </div>
        <div id="babyList" style="padding-bottom: 20px;"></div>
    </div>

<script>
    const firebaseConfig = (typeof FIREBASE_LOCAL_CONFIG !== 'undefined')
        ? FIREBASE_LOCAL_CONFIG
        : {
            apiKey:            "__FIREBASE_API_KEY__",
            authDomain:        "__FIREBASE_AUTH_DOMAIN__",
            projectId:         "__FIREBASE_PROJECT_ID__",
            storageBucket:     "__FIREBASE_STORAGE_BUCKET__",
            messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
            appId:             "__FIREBASE_APP_ID__"
        };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    let babiesCache = [];
    let currentUser = null;
    let currentRole = 'entry';   // 'entry' or 'admin'

    // HTML-escape user-supplied values before interpolating into innerHTML.
    function esc(s) {
        return String(s ?? '').replace(/[&<>"'`]/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;'
        }[c]));
    }

    // ── Auth ────────────────────────────────────────────────

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            const role = await getUserRole(user.email);
            if (!role) {
                await auth.signOut();
                showAuthScreen();
                alert(`Access denied. ${user.email} is not authorised to use this app. Please contact the research team.`);
                return;
            }
            currentUser = user;
            currentRole = role;
            document.getElementById('userEmail').textContent = `${user.email}${role === 'admin' ? ' (admin)' : ''}`;
            await loadBabiesFromFirestore();
            showApp();
            showDashboard();
        } else {
            currentUser = null;
            currentRole = 'entry';
            babiesCache = [];
            showAuthScreen();
        }
    });

    // Returns the user's role ('admin' or 'entry') if allowed, null otherwise.
    async function getUserRole(email) {
        const snap = await db.collection('allowedUsers').doc(email).get();
        if (!snap.exists) return null;
        return snap.data().role === 'admin' ? 'admin' : 'entry';
    }

    function showApp() {
        document.getElementById('loadingScreen').style.display  = 'none';
        document.getElementById('authScreen').style.display     = 'none';
        document.getElementById('appContent').style.display     = 'block';
    }

    function showAuthScreen() {
        document.getElementById('loadingScreen').style.display  = 'none';
        document.getElementById('authScreen').style.display     = 'flex';
        document.getElementById('appContent').style.display     = 'none';
    }

    async function signInWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
            // Popup works reliably on real HTTPS domains.
            // Fall back to redirect if the browser blocks the popup.
            await auth.signInWithPopup(provider);
        } catch (e) {
            if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user') {
                try {
                    await auth.signInWithRedirect(provider);
                } catch (e2) {
                    alert('Sign in failed: ' + e2.message);
                }
            } else {
                alert('Sign in failed: ' + e.message);
            }
        }
    }

    async function doSignOut() {
        if (confirm('Sign out?')) await auth.signOut();
    }

    // ── Firestore ───────────────────────────────────────────

    function userDocRef() {
        return db.collection('users').doc(currentUser.uid);
    }

    async function loadBabiesFromFirestore() {
        if (currentRole === 'admin') {
            // Admin sees everyone's data. Each baby is tagged with the owner's uid
            // and the email of who entered it, so writes still go to the right doc.
            const snap = await db.collection('users').get();
            babiesCache = [];
            snap.forEach(doc => {
                const data = doc.data();
                (data.babies || []).forEach(b => {
                    babiesCache.push({ ...b, _ownerUid: doc.id, _enteredBy: data.ownerEmail || '' });
                });
            });
        } else {
            const snap = await userDocRef().get();
            babiesCache = snap.exists ? (snap.data().babies || []) : [];
        }
    }

    // Saves only the CURRENT user's own records. Admin view is read-only across users.
    async function saveBabiesToFirestore() {
        const myBabies = babiesCache
            .filter(b => !b._ownerUid || b._ownerUid === currentUser.uid)
            .map(b => {
                const { _ownerUid, _enteredBy, ...clean } = b;
                return clean;
            });
        await userDocRef().set(
            { babies: myBabies, ownerEmail: currentUser.email },
            { merge: true }
        );
    }

    // ── Date helpers ────────────────────────────────────────

    function dateInputToDisplay(val) {
        const [y, m, d] = val.split('-');
        return `${d}/${m}/${y}`;
    }

    function displayToDateInput(val) {
        const [d, m, y] = val.split('/');
        return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    }

    function parseDDMMYYYY(val) {
        const [d, m, y] = val.split('/');
        return new Date(y, m - 1, d);
    }

    // ── Dashboard ───────────────────────────────────────────

    function showDashboard() {
        showOverview();
        showMilestonePanel();
    }

    function showOverview() {
        if (babiesCache.length === 0) return;
        const sorted = [...babiesCache].sort((a, b) =>
            parseDDMMYYYY(a.birthDateStr) - parseDDMMYYYY(b.birthDateStr));
        const oldest = sorted[0];
        const newest = sorted[sorted.length - 1];
        document.getElementById('statsRow').innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${babiesCache.length}</div>
                <div class="stat-label">Total Babies</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">📅</div>
                <div class="stat-label">Oldest Entry</div>
                <div class="stat-sub">${esc(oldest.birthDateStr)}<br><span style="font-weight:normal;color:#bbb">${esc(oldest.name)}</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-value">🆕</div>
                <div class="stat-label">Newest Entry</div>
                <div class="stat-sub">${esc(newest.birthDateStr)}<br><span style="font-weight:normal;color:#bbb">${esc(newest.name)}</span></div>
            </div>`;
        document.getElementById('overviewPanel').style.display = 'block';
    }

    function showMilestonePanel() {
        const today = new Date(); today.setHours(0,0,0,0);
        const in7   = new Date(today); in7.setDate(today.getDate() + 7);
        const ago7  = new Date(today); ago7.setDate(today.getDate() - 7);

        const upcoming = [], recent = [];
        babiesCache.forEach(baby => {
            baby.milestones.forEach(m => {
                const md = new Date(m.date); md.setHours(0,0,0,0);
                if (md.getTime() === today.getTime()) {
                    upcoming.unshift({ baby, m, md, isToday: true });
                } else if (md > today && md <= in7) {
                    upcoming.push({ baby, m, md, isToday: false });
                } else if (md >= ago7 && md < today) {
                    recent.push({ baby, m, md });
                }
            });
        });

        if (upcoming.length === 0 && recent.length === 0) return;

        let html = '';
        upcoming.sort((a,b) => a.md - b.md).forEach(({ baby, m, md, isToday }) => {
            const days = Math.round((md - today) / 86400000);
            const when = isToday ? 'Today!' : `in ${days} day${days > 1 ? 's' : ''} (${md.toLocaleDateString('en-GB')})`;
            html += `<div class="milestone-item ${isToday ? 'today' : 'upcoming'}">${isToday ? '🎉' : '⏰'} <strong>${esc(baby.name)}</strong> — ${m.months} month milestone ${when}</div>`;
        });
        recent.sort((a,b) => b.md - a.md).forEach(({ baby, m, md }) => {
            const days = Math.round((today - md) / 86400000);
            html += `<div class="milestone-item recent">✅ <strong>${esc(baby.name)}</strong> — ${m.months} month milestone ${days} day${days > 1 ? 's' : ''} ago (${md.toLocaleDateString('en-GB')})</div>`;
        });

        document.getElementById('milestoneItems').innerHTML = html;
        document.getElementById('milestonePanel').classList.add('has-items');
    }

    // ── Calculate & save ────────────────────────────────────

    async function calculateMilestones() {
        const name             = document.getElementById('babyName').value.trim();
        const birthDateInput   = document.getElementById('birthDate').value;
        const gestationalWeeks = parseInt(document.getElementById('gestationalWeeks').value) || 0;
        const gestationalDays  = parseInt(document.getElementById('gestationalDays').value)  || 0;

        if (!name || !birthDateInput || !gestationalWeeks) {
            alert('Please fill in all fields'); return;
        }

        const birthDateStr = dateInputToDisplay(birthDateInput);
        const [y, m, d]    = birthDateInput.split('-');
        const birthDate    = new Date(y, m - 1, d);
        if (isNaN(birthDate.getTime())) { alert('Invalid date'); return; }

        const adjustDays = (40 * 7) - ((gestationalWeeks * 7) + gestationalDays);
        const gestDisplay = gestationalDays > 0
            ? `${gestationalWeeks}w ${gestationalDays}d`
            : `${gestationalWeeks} weeks`;

        const milestoneData = [];
        let rows = `
            <div class="result-row"><span class="result-label">Name</span><span class="result-value">${esc(name)}</span></div>
            <div class="result-row"><span class="result-label">Birth Date</span><span class="result-value">${esc(birthDateStr)}</span></div>
            <div class="result-row"><span class="result-label">Gestational Age</span><span class="result-value">${esc(gestDisplay)}</span></div>`;

        [6, 9, 12].forEach(months => {
            const md = new Date(birthDate);
            md.setMonth(md.getMonth() + months);
            md.setDate(md.getDate() + adjustDays);
            milestoneData.push({ months, date: md.toISOString() });
            rows += `<div class="result-row"><span class="result-label">${months} months</span><span class="result-value">${md.toLocaleDateString('en-GB')}</span></div>`;
            scheduleNotification(name, months, md);
        });

        await saveData({ name, birthDateStr, gestationalWeeks, gestationalDays, milestones: milestoneData });

        const panel = document.getElementById('results');
        panel.innerHTML = `<h3>${esc(name)}'s Milestones</h3>${rows}`;
        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        // Clear form
        document.getElementById('babyName').value         = '';
        document.getElementById('birthDate').value        = '';
        document.getElementById('gestationalWeeks').value = '';
        document.getElementById('gestationalDays').value  = '';
    }

    async function saveData(data) {
        const i = babiesCache.findIndex(b => b.name === data.name && b.birthDateStr === data.birthDateStr);
        if (i >= 0) { babiesCache[i] = data; } else { babiesCache.push(data); }
        await saveBabiesToFirestore();
    }

    // ── List screen ─────────────────────────────────────────

    function viewSavedData() {
        if (babiesCache.length === 0) { alert('No saved data yet'); return; }

        // Sort alphabetically
        const sorted = babiesCache
            .map((baby, originalIndex) => ({ baby, originalIndex }))
            .sort((a, b) => a.baby.name.localeCompare(b.baby.name));

        let html = '';
        sorted.forEach(({ baby, originalIndex: idx }) => {
            const gestDisplay = baby.gestationalDays > 0
                ? `${baby.gestationalWeeks} weeks ${baby.gestationalDays} days`
                : `${baby.gestationalWeeks || baby.gestationalAge} weeks`;

            // For admins: records owned by other users are read-only.
            const isOwnRecord = !baby._ownerUid || baby._ownerUid === currentUser.uid;
            const enteredByRow = baby._enteredBy
                ? `<div class="detail-row"><span class="detail-label">Entered by</span><span class="detail-value">${esc(baby._enteredBy)}</span></div>`
                : '';
            const actions = isOwnRecord
                ? `<div class="detail-actions">
                    <button class="action-btn edit-btn-card"   onclick="startEdit(${idx})">✏️ Edit</button>
                    <button class="action-btn delete-btn-card" onclick="deleteBaby(${idx})">🗑️ Delete</button>
                   </div>`
                : `<div class="detail-actions" style="opacity:0.6;font-size:13px;color:#888;padding-top:10px">Read-only (entered by another researcher)</div>`;
            const editForm = isOwnRecord
                ? `<div class="edit-form" id="editForm-${idx}" style="display:none">
                        <label>Baby's Name</label>
                        <input type="text" id="editName-${idx}" value="${esc(baby.name)}">
                        <label>Birth Date</label>
                        <input type="date" id="editBirthDate-${idx}" value="${esc(displayToDateInput(baby.birthDateStr))}">
                        <label>Gestational Age</label>
                        <div class="two-col">
                            <input type="number" id="editWeeks-${idx}" value="${esc(baby.gestationalWeeks || baby.gestationalAge || '')}" placeholder="Weeks" min="20" max="44">
                            <input type="number" id="editDays-${idx}"  value="${esc(baby.gestationalDays || 0)}" placeholder="Days" min="0" max="6">
                        </div>
                        <div class="edit-actions">
                            <button class="save-btn"   onclick="saveEdit(${idx})">💾 Save</button>
                            <button class="cancel-btn" onclick="cancelEdit(${idx})">✕ Cancel</button>
                        </div>
                   </div>`
                : '';

            let milestoneRows = '';
            baby.milestones.forEach(m => {
                milestoneRows += `
                    <div class="detail-row">
                        <span class="detail-label">${m.months} months</span>
                        <span class="detail-value">${new Date(m.date).toLocaleDateString('en-GB')}</span>
                    </div>`;
            });

            html += `
            <div class="baby-card" id="card-${idx}">
                <div class="baby-row" onclick="toggleCard(${idx})">
                    <div class="baby-row-info">
                        <span class="baby-row-name">${esc(baby.name)}</span>
                        <span class="baby-row-date">Born: ${esc(baby.birthDateStr)}</span>
                    </div>
                    <span class="chevron" id="chevron-${idx}">›</span>
                </div>
                <div class="baby-detail" id="detail-${idx}">
                    <div class="detail-view" id="detailView-${idx}">
                        <div class="detail-row">
                            <span class="detail-label">Gestational Age</span>
                            <span class="detail-value">${esc(gestDisplay)}</span>
                        </div>
                        ${enteredByRow}
                        ${milestoneRows}
                        ${actions}
                    </div>
                    ${editForm}
                </div>
            </div>`;
        });

        document.getElementById('listCount').textContent = `${babiesCache.length} record${babiesCache.length !== 1 ? 's' : ''}`;
        document.getElementById('babyList').innerHTML    = html;
        document.getElementById('listScreen').classList.add('open');
        window.scrollTo(0, 0);
    }

    function closeListScreen() {
        document.getElementById('listScreen').classList.remove('open');
    }

    function toggleCard(idx) {
        const detail  = document.getElementById(`detail-${idx}`);
        const chevron = document.getElementById(`chevron-${idx}`);
        const isOpen  = detail.style.display === 'block';

        // Collapse all
        document.querySelectorAll('.baby-detail').forEach(d => d.style.display = 'none');
        document.querySelectorAll('.chevron').forEach(c => c.classList.remove('open'));

        if (!isOpen) {
            detail.style.display = 'block';
            chevron.classList.add('open');
        }
    }

    function startEdit(idx) {
        document.getElementById(`detailView-${idx}`).style.display = 'none';
        document.getElementById(`editForm-${idx}`).style.display   = 'block';
    }

    function cancelEdit(idx) {
        document.getElementById(`editForm-${idx}`).style.display   = 'none';
        document.getElementById(`detailView-${idx}`).style.display = 'block';
    }

    async function saveEdit(idx) {
        const name             = document.getElementById(`editName-${idx}`).value.trim();
        const birthDateInput   = document.getElementById(`editBirthDate-${idx}`).value;
        const gestationalWeeks = parseInt(document.getElementById(`editWeeks-${idx}`).value) || 0;
        const gestationalDays  = parseInt(document.getElementById(`editDays-${idx}`).value)  || 0;

        if (!name || !birthDateInput || !gestationalWeeks) {
            alert('Please fill in all fields'); return;
        }

        const birthDateStr = dateInputToDisplay(birthDateInput);
        const [y, m, d]    = birthDateInput.split('-');
        const birthDate    = new Date(y, m - 1, d);
        const adjustDays   = (40 * 7) - ((gestationalWeeks * 7) + gestationalDays);

        const milestones = [6, 9, 12].map(months => {
            const md = new Date(birthDate);
            md.setMonth(md.getMonth() + months);
            md.setDate(md.getDate() + adjustDays);
            return { months, date: md.toISOString() };
        });

        babiesCache[idx] = { name, birthDateStr, gestationalWeeks, gestationalDays, milestones };
        await saveBabiesToFirestore();
        viewSavedData();
    }

    async function deleteBaby(idx) {
        if (!confirm(`Delete ${babiesCache[idx].name}?`)) return;
        babiesCache.splice(idx, 1);
        await saveBabiesToFirestore();
        if (babiesCache.length === 0) {
            closeListScreen();
        } else {
            viewSavedData();
        }
    }

    // ── Export / Import ─────────────────────────────────────

    function exportData() {
        const blob = new Blob([JSON.stringify({ babies: babiesCache, exportDate: new Date().toISOString() }, null, 2)], { type: 'application/json' });
        triggerDownload(blob, `baby-milestones-backup-${todayStr()}.json`);
        alert('JSON backup downloaded!');
    }

    function exportCSV() {
        if (babiesCache.length === 0) { alert('No data to export'); return; }
        const header = ['Name','Birth Date','Gestational Weeks','Gestational Days','6 Month Milestone','9 Month Milestone','12 Month Milestone'];
        if (currentRole === 'admin') header.push('Entered By');
        const rows = [header];
        babiesCache.forEach(baby => {
            const ms = {};
            baby.milestones.forEach(m => { ms[m.months] = new Date(m.date).toLocaleDateString('en-GB'); });
            const row = [baby.name, baby.birthDateStr, baby.gestationalWeeks || baby.gestationalAge || '', baby.gestationalDays || 0, ms[6]||'', ms[9]||'', ms[12]||''];
            if (currentRole === 'admin') row.push(baby._enteredBy || '');
            rows.push(row);
        });
        const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
        triggerDownload(new Blob([csv], { type: 'text/csv' }), `baby-milestones-${todayStr()}.csv`);
    }

    function triggerDownload(blob, filename) {
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: filename });
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function todayStr() { return new Date().toISOString().split('T')[0]; }

    async function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (!data.babies || !Array.isArray(data.babies)) {
                    alert('Invalid backup file format'); return;
                }
                const cleaned = [];
                for (const b of data.babies) {
                    if (!b || typeof b.name !== 'string' || typeof b.birthDateStr !== 'string') {
                        alert('Invalid backup file: malformed record'); return;
                    }
                    if (b.name.length > 100 || !/^\d{2}\/\d{2}\/\d{4}$/.test(b.birthDateStr)) {
                        alert('Invalid backup file: bad name or date'); return;
                    }
                    const milestones = Array.isArray(b.milestones) ? b.milestones.filter(m =>
                        m && typeof m.months === 'number' && typeof m.date === 'string'
                    ).map(m => ({ months: m.months, date: m.date })) : [];
                    cleaned.push({
                        name: b.name.slice(0, 100),
                        birthDateStr: b.birthDateStr,
                        gestationalWeeks: Number(b.gestationalWeeks) || Number(b.gestationalAge) || 0,
                        gestationalDays:  Number(b.gestationalDays)  || 0,
                        milestones
                    });
                }
                if (confirm(`Import ${cleaned.length} record(s)? This will replace current data.`)) {
                    babiesCache = cleaned;
                    await saveBabiesToFirestore();
                    alert('Data imported successfully!');
                    showDashboard();
                }
            } catch { alert('Error reading backup file'); }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ── Notifications ────────────────────────────────────────

    function scheduleNotification(name, months, date) {
        if ('Notification' in window) Notification.requestPermission();
        const timeUntil = date - new Date();
        if (timeUntil > 0 && timeUntil <= 2147483647) {
            setTimeout(() => {
                if (Notification.permission === 'granted') {
                    new Notification(`${name}'s Milestone!`, { body: `${name} has completed ${months} months today!` });
                }
            }, timeUntil);
        }
    }
</script>
